name: Claude - implement approved issues

# Fires when the repo owner comments exactly "/approve" on an issue (not a
# PR). This is Claude's only step that calls the API and costs anything -
# claude-issue-plan.yml just posts a static comment, no AI involved. Claude
# reads the issue fresh here (there's no separate plan comment to re-read),
# implements it, pushes a branch, and opens a pull request - it never
# merges. The PR itself is the real approval gate from here: nothing lands
# without a human reviewing and merging it.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  # claude-code-action authenticates by exchanging a short-lived OIDC token
  # for a scoped GitHub token; without this, it fails before it ever gets to
  # using ANTHROPIC_API_KEY (confirmed via a failed run on the old plan
  # step: "Could not fetch an OIDC token... add id-token: write").
  id-token: write
  # Needed for any run whose implementation touches .github/workflows/* -
  # GitHub rejects such a push with "refusing to allow a GitHub App to
  # create or update workflow ... without `workflows` permission" otherwise,
  # even though the Claude GitHub App installation itself already has
  # workflows read/write (that's just the ceiling; this workflow's own
  # token still has to request the scope). Confirmed via a real run on
  # issue #7 that got all the way to pushing before hitting this.
  workflows: write

jobs:
  implement:
    # Only a plain issue comment (issue_comment also fires for PR comments,
    # where github.event.issue.pull_request is present), only the exact
    # "/approve" text, and only from the repo owner.
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/approve' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Implement the approved issue
        uses: anthropics/claude-code-action@main
        with:
          # Without an explicit allowlist, the action denies tool calls in
          # this non-interactive CI run rather than prompting for approval -
          # confirmed by a real /approve run that cost $0.07, made 7 turns,
          # hit 5 permission denials, and produced no branch, no PR, and no
          # comment. This grants exactly what the prompt below asks for:
          # reading/searching the repo, editing files, and running git/gh to
          # branch, commit, push and open the PR.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Read,Edit,MultiEdit,Write,Glob,Grep,LS,Bash(git:*),Bash(gh:*)"
          prompt: |
            The repo owner just approved issue #${{ github.event.issue.number }}
            on this repository by commenting `/approve`. Nothing has looked at
            this issue yet beyond posting that approval prompt - read it fresh.

            1. Read the issue (and any other comments on it) and enough of the
               codebase to understand the request or bug.
            2. Create a new branch named `claude/issue-${{ github.event.issue.number }}`.
            3. Implement it.
            4. Commit and push the branch.
            5. Open a pull request from that branch against the repository's
               default branch. In the body, explain your understanding of the
               request and what you changed (this is the first time anyone
               sees your plan, since there was no separate planning pass), and
               include the line `Closes #${{ github.event.issue.number }}`.
            6. Post a short comment on the issue linking the pull request.

            Do not merge the pull request - a human reviews and merges it.
            If the issue is too vague or ambiguous to implement confidently,
            don't guess: post a comment on the issue asking for clarification
            instead of opening a pull request.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
