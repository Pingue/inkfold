name: Claude - notify on new issues

# When someone opens an issue, post a plain static comment - no AI call, no
# API cost. Claude only does any actual work in claude-issue-implement.yml,
# once the repo owner comments "/approve" on the issue.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post approval-gate comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "This will be addressed by Claude. The repository owner needs to comment `/approve` to continue.",
            });
