name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need full history and tags to find the latest release tag below.
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest_tag" ]; then
            major=1; minor=0; patch=0
          else
            semver="${latest_tag#v}"
            major="${semver%%.*}"
            rest="${semver#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
              patch=$((patch + 1))
            fi
          fi
          version_name="${major}.${minor}.${patch}"
          version_code=$((major * 10000 + minor * 100 + patch))
          if [ "${{ github.ref }}" != "refs/heads/main" ] || [ "${{ github.event_name }}" != "push" ]; then
            version_name="${version_name}-dev"
          fi
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's v3 default package list still requests the legacy
          # "tools" package, which Google has removed from the SDK repository
          # (sdkmanager now fails outright rather than skipping it). Pin the
          # package list explicitly to avoid it; AGP downloads the specific
          # platform/build-tools it needs during the Gradle build itself.
          packages: "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace \
            -PversionNameOverride="${{ steps.version.outputs.version_name }}" \
            -PversionCodeOverride="${{ steps.version.outputs.version_code }}"

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pennotes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---- Signed release APK (only when the keystore secret is configured) ----
      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PversionNameOverride="${{ steps.version.outputs.version_name }}" \
            -PversionCodeOverride="${{ steps.version.outputs.version_code }}"

      - name: Upload release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pennotes-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ---- Signed release AAB, for Play Store upload (only when the keystore secret is configured) ----
      - name: Build signed release AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --stacktrace \
            -PversionNameOverride="${{ steps.version.outputs.version_name }}" \
            -PversionCodeOverride="${{ steps.version.outputs.version_code }}"

      - name: Upload release AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pennotes-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # ---- Tag and publish a GitHub release (only for builds on main) ----
      - name: Tag and create GitHub release
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"

          assets=(app/build/outputs/apk/debug/*.apk)
          if [ -n "$KEYSTORE_BASE64" ]; then
            assets+=(app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab)
          fi

          gh release create "$tag" "${assets[@]}" \
            --title "$tag" \
            --generate-notes
